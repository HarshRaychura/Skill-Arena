<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>All Courses | Skill Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@700&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body data-page="courses">
    <div id="nav"></div>
    <main>
        <h1>All Courses</h1>
        <div class="bar"><input id="q" class="form-control" type="search" placeholder="Search courses..."
                aria-label="Search courses"><select id="lv" class="form-select" style="max-width:200px"
                aria-label="Level">
                <option value="">All levels</option>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
            </select></div>
        <div class="grid" id="grid"></div>
    </main>
    <div id="foot"></div>
    <script src="js/data.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
